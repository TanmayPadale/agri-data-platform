# dbt turns the raw tables into tested, documented models:
#   raw (ingest code) -> staging (one model per source) -> marts (what readers use)
#
# Run from the repo root:  make dbt-build   (= dbt deps + dbt build)

name: agri
version: "1.0.0"
config-version: 2
profile: agri

model-paths: ["models"]
# sensors.csv lives in transform/seeds; locations.csv stays in the repo's top-level
# seeds/ folder because the Day 1 ingest code reads it too. One file, two readers.
seed-paths: ["seeds", "../seeds"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

vars:
  # The irrigation rule, as variables so it can change without touching SQL:
  #   dbt build --vars '{moisture_threshold_pct: 30}'
  moisture_threshold_pct: 25  # flag a field when its 3-day average moisture is below this...
  rain_threshold_mm: 2  # ...and that day's rain is below this
  calendar_start: "2026-01-01"  # first day of dim_date

models:
  agri:
    staging:
      +schema: staging
      +materialized: view  # cheap to rebuild, always current
    intermediate:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table  # readers hit these often, so store them

seeds:
  agri:
    +schema: staging
    locations:
      +column_types: {location_id: integer, latitude: numeric, longitude: numeric}
    sensors:
      +column_types: {location_id: integer}

snapshots:
  agri:
    +schema: snapshots

flags:
  send_anonymous_usage_stats: false  # no telemetry from this project

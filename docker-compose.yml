# Local services for the platform. Sized for an 8 GB laptop:
#   make up          Postgres only (Days 1, 3, 4, 6, 8)
#   make up-stream   + Kafka and Redis (Days 2, 5, 7). Never run Kafka next to Airflow on 8 GB.
#   make up-monitoring  + Prometheus, Grafana and kafka-exporter (Day 7)
#   make emulator    LocalStack, a free local AWS (Day 5)
#
# Who connects where:
#   your Mac (python, dbt, airflow)   localhost:5432 / localhost:9092 / localhost:6379
#   containers and kind pods          host.docker.internal:5432 / :29092 / :6379

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: agri
      POSTGRES_PASSWORD: agri
      POSTGRES_DB: agri
    ports: ["5432:5432"]          # if 5432 is taken, use "5433:5432" and adjust the DSN
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U agri -d agri"]   # TCP, so the init-time socket-only server doesn't count
      interval: 5s
      retries: 10
      start_period: 10s

  # Day 2: a single Kafka 4 broker in KRaft mode (no ZooKeeper since Kafka 4.0).
  # One node plays both roles: broker (stores partitions) and controller (keeps
  # cluster metadata in its own Raft log). Development only: replication factor 1.
  kafka:
    image: apache/kafka:4.3.1
    profiles: ["stream"]
    ports:
      - "9092:9092"     # HOST listener: programs on your Mac
      - "29092:29092"   # DOCKER listener: containers and kind pods, via host.docker.internal
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # A client first connects to any listener, then is told the ADVERTISED address
      # to use from then on. Each audience needs an address it can actually reach.
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://host.docker.internal:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: HOST
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are created on purpose (make topics)
      KAFKA_LOG_RETENTION_HOURS: 168             # 7 days of replay
      KAFKA_HEAP_OPTS: "-Xms384m -Xmx384m"       # keep the JVM small on 8 GB
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      retries: 12
      start_period: 20s

  # Day 2: dedupe memory (seen:{event_id}) and the latest value per sensor (latest:{sensor_id}).
  redis:
    image: redis:8.2-alpine
    profiles: ["stream"]
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-ttl"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Day 5: a free local AWS for Terraform (make tf-emulator-apply). Pinned to 4.14, the
  # last community build before LocalStack's March 2026 image change: no account needed.
  localstack:
    image: localstack/localstack:4.14
    profiles: ["aws"]
    ports: ["4566:4566"]
    environment:
      SERVICES: s3,iam,sts,lambda,logs,events
      # Lambda functions run in their own containers, so LocalStack needs Docker access.
      LAMBDA_DOCKER_FLAGS: "--add-host=host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      retries: 20

  # Day 7: monitoring (make up-monitoring), about 300 MB of memory together.
  #   Prometheus  pulls metrics every 15 s and evaluates alerts.yml   http://localhost:9090
  #   Grafana     draws the dashboard in monitoring/grafana           http://localhost:3000
  #   kafka-exporter  reads consumer-group lag from Kafka and exposes it as a metric
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ["monitoring"]
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    extra_hosts: ["host.docker.internal:host-gateway"]   # to scrape the consumer on your Mac
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      retries: 12

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.10.0
    profiles: ["monitoring"]
    # Kafka 4 dropped the oldest protocol versions, so tell the client to speak a newer one.
    command: ["--kafka.server=host.docker.internal:29092", "--kafka.version=3.9.0"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      kafka: {condition: service_healthy}

  grafana:
    image: grafana/grafana:13.2.3
    profiles: ["monitoring"]
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"      # local only: view dashboards without logging in
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer     # edit by logging in as admin / admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/agri-dashboard.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

volumes:
  pgdata:
  kafkadata:

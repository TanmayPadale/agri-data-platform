# Example only: this file is NOT applied (see kustomization.yaml). Real secrets never
# go into git. scripts/verify_mac.sh creates the secret from your local DSN with:
#   kubectl -n agri create secret generic agri-db \
#     --from-literal=AGRI_DSN=postgresql://agri:agri@host.docker.internal:5432/agri
apiVersion: v1
kind: Secret
metadata:
  name: agri-db
  namespace: agri
type: Opaque
stringData:
  AGRI_DSN: "postgresql://USER:PASSWORD@host.docker.internal:5432/agri"

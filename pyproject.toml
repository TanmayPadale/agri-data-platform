[project]
name = "agri-data-platform"
version = "0.1.0"
description = "Weather and soil sensors in, one irrigation decision out: a small end-to-end data platform."
authors = [
    { name = "Tanmay Padale", email = "tanmaypadale24@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.15",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "redis>=7",
]

[project.scripts]
agri-data-platform = "agri_data_platform:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
ai = [
    "anthropic>=0.70",
    "pypdf>=5",
]
aws = [
    "boto3>=1.40",
    "moto[s3]>=5.1",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
transform = [
    "dbt-core>=1.10.5",
    "dbt-postgres>=1.9",
]

[tool.uv]
# `uv sync` installs every group for local work; the Docker image installs none.
default-groups = "all"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"  # slow LLM tests run only when asked: pytest -m slow
pythonpath = ["."]
markers = [
    "db: needs Postgres (make up); skipped when it is not running",
    "slow: long-running tests such as LLM evals; CI skips them",
]

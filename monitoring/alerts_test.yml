# Unit tests for alerts.yml. promtool feeds in made-up series, evaluates the rules
# over time and checks which alerts are firing at each moment. Run: make alerts-check
#
# Series notation: '0x20 1x20' means the value 0 for 20 steps, then 1 for 20 steps.
# '0+200x60' means start at 0 and add 200 at each of 60 steps. A step is the interval.
rule_files:
  - alerts.yml

evaluation_interval: 15s

tests:
  # One poison message 5 minutes in. The alert has no `for:`, so it fires at once,
  # and it stops once the message is older than the 5-minute window.
  - interval: 15s
    input_series:
      - series: 'dlq_messages_total{job="sensor-consumer", instance="host.docker.internal:8000"}'
        values: '0x20 1x40'
    alert_rule_test:
      - eval_time: 4m
        alertname: SensorMessagesInDLQ
        exp_alerts: []
      - eval_time: 6m
        alertname: SensorMessagesInDLQ
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Sensor messages are failing validation and going to the DLQ"
              description: "Inspect them with `make dlq`. The headers say which check failed and where the message came from."
      - eval_time: 12m
        alertname: SensorMessagesInDLQ
        exp_alerts: []

  # Lag passes 1,000 after 75 seconds and keeps growing. With `for: 10m` the alert
  # waits (pending) for 10 minutes of sustained lag before it fires.
  - interval: 15s
    input_series:
      - series: 'kafka_consumergroup_lag{consumergroup="agri-loader", topic="sensor.readings", partition="0"}'
        values: '0+200x80'
    alert_rule_test:
      - eval_time: 5m
        alertname: ConsumerLagGrowing
        exp_alerts: []
      - eval_time: 15m
        alertname: ConsumerLagGrowing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "agri-loader is falling behind sensor.readings"
              description: "Check that the consumers are running (kubectl -n agri get pods) and not crash-looping."

  # The consumer stops answering scrapes after 2.5 minutes. `for: 2m` means a single
  # failed scrape (a restart, a slow GC) does not page anyone.
  - interval: 15s
    input_series:
      - series: 'up{job="sensor-consumer", instance="host.docker.internal:8000"}'
        values: '1x10 0x30'
    alert_rule_test:
      - eval_time: 3m
        alertname: ConsumerDown
        exp_alerts: []
      - eval_time: 6m
        alertname: ConsumerDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: sensor-consumer
              instance: host.docker.internal:8000
            exp_annotations:
              summary: "Prometheus cannot reach the sensor consumer's /metrics"
